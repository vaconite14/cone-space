<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapat Tim Cone Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #15131c; --panel: #201d2a; --tile: #2a2636; --ink: #f4efe6; --muted: #a59fb5; --line: #3a3549;
  --talk: #5ce08a; --warn: #ffcc4d; --red: #ff5a5f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: 'Pixelify Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 2px solid var(--line); }
header h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; }
.rec { width: 10px; height: 10px; background: var(--red); flex: none; }
.timer, .count { color: var(--muted); font-size: 15px; white-space: nowrap; }
@media (max-width: 600px) { .count { display: none; } header h1 { font-size: 17px; } }
.spacer { flex: 1; }
.offline { display: none; background: #3b1f26; color: #ffb3b6; border: 2px solid #6b2a35; padding: 4px 10px; font-size: 14px; }
.offline.on { display: block; }
.notes-btn { background: var(--tile); border: 2px solid var(--line); color: var(--ink); font: inherit; font-size: 14px; padding: 4px 10px; cursor: pointer; }
.notes-btn:hover { border-color: var(--muted); }
.notes-btn.on { background: #3a3550; border-color: #8b80ff; }
main { flex: 1; display: flex; min-height: 0; }
/* fitStage() picks the column count and tile width that fill the stage without scrolling or overlap */
.stage { flex: 1; min-width: 0; min-height: 0; padding: 16px; display: grid; gap: var(--gap, 14px);
  grid-template-columns: repeat(var(--cols, 3), var(--tw, 240px)); justify-content: center; align-content: center; overflow: auto; }
.tile { position: relative; background: var(--tile); width: var(--tw, 240px); aspect-ratio: 4 / 3; border: 3px solid var(--line); overflow: hidden;
  container-type: inline-size; transition: border-color .2s, box-shadow .2s; }
.tile canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.tile.talking { border-color: var(--talk); box-shadow: 0 0 0 3px #5ce08a33, 0 0 22px #5ce08a44; }
.tile.needs { border-color: var(--warn); box-shadow: 0 0 0 3px #ffcc4d33; }
.tile.idle canvas { filter: saturate(.8) brightness(.85); }
.name { position: absolute; left: 3cqw; bottom: 3cqw; max-width: 94cqw; display: flex; align-items: center; gap: 6px; background: #000000aa; padding: 4px 8px;
  font-size: clamp(10px, 5.6cqw, 15px); font-weight: 600; white-space: nowrap; overflow: hidden; }
.dot { width: 8px; height: 8px; background: var(--muted); }
.tile.talking .dot { background: var(--talk); }
.tile.needs .dot { background: var(--warn); }
.role { color: var(--muted); font-weight: 400; font-size: clamp(9px, 4.8cqw, 13px); overflow: hidden; text-overflow: ellipsis; }
.chip { position: absolute; left: 3cqw; top: 3cqw; max-width: 60cqw; background: #000000aa; padding: 3px 8px; font-size: clamp(9px, 4.8cqw, 13px); color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.talking .chip, .tile.needs .chip { display: none; }
/* the speech bubble next to the head: pixel border, a stepped tail pointing at the face */
.bubble { position: absolute; left: 67%; top: 9%; width: 31%; max-height: 62%; overflow: hidden;
  background: #fffdf6; color: #1a1420; font-size: clamp(8px, 4.6cqw, 13px); line-height: 1.25; padding: 2cqw 2.5cqw;
  box-shadow: 0 -3px 0 0 #1a1420, 0 3px 0 0 #1a1420, -3px 0 0 0 #1a1420, 3px 0 0 0 #1a1420; opacity: 0; transform: translateY(6px) scale(.9); transform-origin: 0 100%;
  transition: opacity .15s steps(3), transform .15s steps(3); pointer-events: none; overflow-wrap: anywhere; }
.bubble.on { opacity: 1; transform: none; }
.bubble::before, .bubble::after { content: ''; position: absolute; background: #fffdf6; box-shadow: 0 3px 0 0 #1a1420, -3px 0 0 0 #1a1420; }
.bubble::before { left: -9px; bottom: 6px; width: 9px; height: 6px; }
.bubble::after { left: -15px; bottom: 3px; width: 6px; height: 3px; }
.bubble .who { font-weight: 700; font-size: clamp(8px, 3.8cqw, 11px); color: #7a6f8a; display: block; }
.hand { font-size: clamp(14px, 8cqw, 22px); }
/* small tiles: drop the extras so the name and bubble still fit */
@container (max-width: 200px) {
  .role, .bubble .who { display: none; }
  .bubble { left: 64%; width: 34%; }
}
.caret { display: inline-block; width: 6px; height: 11px; background: #1a1420; margin-left: 2px; vertical-align: -1px; animation: blink 0.8s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hand { position: absolute; right: 10px; bottom: 8px; font-size: 22px; display: none; }
.tile.needs .hand { display: block; animation: wave 0.8s steps(2) infinite; }
@keyframes wave { 50% { transform: rotate(-18deg); } }
aside { width: 300px; background: var(--panel); border-left: 2px solid var(--line); display: flex; flex-direction: column; }
aside.hidden { display: none; }
aside h2 { font-size: 16px; margin: 0; padding: 12px 14px; border-bottom: 2px solid var(--line); }
aside { width: 340px; }
.log { flex: 1; overflow: auto; padding: 10px 12px; margin: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.log li { font-size: 14px; line-height: 1.35; max-width: 88%; padding: 7px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.log li.bos { align-self: flex-end; background: #3a3550; box-shadow: 0 0 0 2px #8b80ff; }
.log li.manager, .log li.agent { align-self: flex-start; background: #fffdf6; color: #1a1420; box-shadow: 0 0 0 2px #1a1420; }
.log li.sys { align-self: center; max-width: 100%; padding: 0; color: var(--muted); font-size: 12px; text-align: center; }
.log li .who { display: block; font-size: 11px; font-weight: 700; opacity: .7; margin-bottom: 2px; }
.log li time { font-size: 11px; opacity: .6; margin-left: 6px; }
.log .empty { color: var(--muted); align-self: center; }
.typing { color: var(--muted); font-size: 13px; padding: 0 14px 6px; min-height: 19px; }
.compose { display: flex; gap: 8px; padding: 10px 12px; border-top: 2px solid var(--line); }
.compose textarea { flex: 1; resize: none; height: 54px; background: var(--tile); color: var(--ink); border: 2px solid var(--line); font: inherit; font-size: 14px; padding: 6px 8px; }
.compose textarea:focus { outline: none; border-color: #8b80ff; }
.compose button { background: #8b80ff; color: #15131c; border: 0; font: inherit; font-weight: 700; padding: 0 14px; cursor: pointer; }
.compose button:disabled { opacity: .5; cursor: default; }
header h1 { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* narrow windows: the chat goes under the faces instead of covering them */
@media (max-width: 760px) {
  main { flex-direction: column; }
  aside { width: auto; height: 45%; border-left: 0; border-top: 2px solid var(--line); }
  .stage { padding: 10px; }
}
</style>
</head>
<body>
<header>
  <div class="rec" aria-hidden="true"></div>
  <h1>Rapat Tim Cone Space</h1>
  <span class="timer" id="timer">00:00</span>
  <span class="spacer"></span>
  <span class="offline" id="offline">Server kantor belum nyala</span>
  <span class="count" id="count"></span>
  <button class="notes-btn on" id="chatBtn" aria-pressed="true">Chat</button>
</header>
<main>
  <section class="stage" id="stage" aria-label="Peserta rapat"></section>
  <aside id="side">
    <h2>Chat tim</h2>
    <ul class="log" id="log" aria-live="polite"><li class="empty">Ngobrol sama tim di bawah. Panggil nama kalau mau ke satu orang.</li></ul>
    <div class="typing" id="typing"></div>
    <form class="compose" id="compose">
      <textarea id="msg" placeholder="Ngobrol sama tim… panggil nama kalau mau ke satu orang (Enter kirim, Shift+Enter baris baru)" aria-label="Pesan untuk tim"></textarea>
      <button id="send">Kirim</button>
    </form>
  </aside>
</main>
<script>
// ---------- the team ----------
// `id` matches the agent's subagent type (or 'manager' for the main Claude session, 'bos' for you).
const TEAM = [
  { id: 'bos', name: 'Sena', role: 'Bos', look: 'bos', bg: '#29282f' },
  { id: 'manager', name: 'Hizkia', role: 'Manager', look: 'hizkia', bg: '#14204a' },
  { id: 'riset-tren', name: 'Salomo', role: 'Riset', look: 'salomo', bg: '#0f2a44' },
  { id: 'scriptwriter', name: 'Daud', role: 'Script', look: 'daud', bg: '#1c1a20' },
  { id: 'planner', name: 'Saul', role: 'Planner', look: 'saul', bg: '#2a1a3d' },
  { id: 'brand-manager', name: 'Yerobeam', role: 'Email & Brand', look: 'yerobeam', bg: '#123a3a' },
  { id: 'video-editor', name: 'Yehu', role: 'Video', look: 'yehu', bg: '#140f24' },
  { id: 'analis-data', name: 'Omri', role: 'Analis Data', look: 'omri', bg: '#33193a' },
  { id: 'keuangan', name: 'Menahem', role: 'Keuangan', look: 'menahem', bg: '#1f1a33' },
];
const BOS = TEAM[0].name, MGR = TEAM[1].name;
const K = '#1a1420', WH = '#ffffff', BLUSH = '#ff8fa3';

// ---------- pixel-art busts: 40x30 cells on a 4:3 tile, drawn from rectangles so they can blink and talk ----------
function drawAvatar(ctx, a, t, st) {
  const S = ctx.canvas.width / 40;
  const bob = st.talking ? Math.round(Math.abs(Math.sin(t * 6))) : 0;
  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x * S, (y + bob) * S, w * S + 0.5, h * S + 0.5); };
  const F = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x * S, y * S, w * S + 0.5, h * S + 0.5); }; // fixed to the room, no bob
  const L = LOOKS[a.look];
  ctx.fillStyle = a.bg; ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  L.room && L.room(F, t);
  const blink = st.sleepy || ((t + a.name.length * 0.7) % 4.2) < 0.13;
  const open = st.talking && Math.sin(t * 14 + a.name.length) > 0;
  const P = { R, t, blink, open, st };
  L.back && L.back(P);
  // shoulders
  R(9, 24, 22, 7, K); R(10, 25, 20, 6, L.shirt); R(11, 25, 6, 2, L.shirtHi);
  R(17, 22, 6, 4, K); R(18, 22, 4, 4, L.skin);
  L.clothes && L.clothes(P);
  // head
  R(13, 7, 14, 16, K); R(14, 8, 12, 14, L.skin); R(14, 20, 12, 2, '#00000014');
  // eyes
  if (L.eyes) L.eyes(P);
  else if (blink) { R(15, 15, 3, 1, K); R(22, 15, 3, 1, K); }
  else for (const ex of [15, 22]) { R(ex, 13, 3, 4, K); R(ex, 14, 3, 3, L.eye); R(ex, 14, 1, 1, WH); R(ex + 2, 16, 1, 1, '#ffffff99'); }
  if (st.sleepy) { R(15, 14, 3, 1, L.skin); R(22, 14, 3, 1, L.skin); }
  R(15, 17, 2, 1, BLUSH); R(23, 17, 2, 1, BLUSH);
  // mouth
  if (L.mouth) L.mouth(P);
  else if (open) { R(19, 19, 3, 2, K); R(20, 20, 1, 1, '#7a2e3a'); }
  else if (st.needs) R(19, 19, 2, 2, K);
  else R(19, 19, 3, 1, K);
  L.front(P);
  L.extra && L.extra(P);
  if (st.sleepy) { const z = Math.floor(t * 2) % 3; for (let i = 0; i <= z; i++) { const x = 30 + i * 2, y = 6 - i * 2; F(x, y, 2, 0.5, '#ffffffaa'); F(x + 1.5, y, 0.5, 1.5, '#ffffffaa'); F(x, y + 1.5, 2, 0.5, '#ffffffaa'); } }
}

const LOOKS = {
  // Sena (the boss, you): long black hair parted in the middle, round glasses, eyes closed in a soft smile,
  // white frilled blouse with a black ribbon, little orange lantern earrings and pendant
  bos: {
    skin: '#fbe9e4', shirt: '#f4f1f6', shirtHi: '#ffffff',
    room: (F) => { F(1, 1, 38, 28, '#ffffff06'); F(3, 2, 34, 0.5, '#ffffff22'); F(3, 2, 0.5, 26, '#ffffff22'); F(36.5, 2, 0.5, 26, '#ffffff22'); F(19, 2.5, 2, 1, '#ffe08a'); },
    back: ({ R }) => { R(10, 6, 20, 25, K); R(11, 7, 18, 24, '#1c1b22'); R(12, 12, 1, 18, '#2c2f45'); R(27, 12, 1, 18, '#2c2f45'); R(14, 22, 1, 9, '#2c2f45'); R(25, 22, 1, 9, '#2c2f45'); },
    clothes: ({ R }) => {
      for (let x = 13; x < 27; x += 2) R(x, 24, 1, 1, '#d9d3e3'); // frilled collar
      R(16, 24, 3, 1, WH); R(21, 24, 3, 1, WH);
      R(18, 25, 4, 1, K); R(19, 26, 2, 1, K); R(18, 27, 1, 3, K); R(21, 27, 1, 3, K); // black ribbon
      R(20, 27, 1, 1, '#d8a63a'); R(19, 28, 2, 2, '#e05a2b'); R(19, 28, 2, 1, '#d8a63a'); // lantern pendant
      R(20, 30, 1, 1, K);
    },
    eyes: ({ R }) => { // closed, smiling: a soft downward curve with lashes
      for (const ex of [15, 22]) { R(ex, 14, 1, 1, '#5a4a52'); R(ex + 1, 15, 2, 1, '#5a4a52'); R(ex + 3, 14, 1, 1, '#5a4a52'); }
    },
    mouth: ({ R, open }) => { if (open) { R(19, 19, 2, 2, '#b85a6a'); } else { R(18, 19, 1, 1, '#c07080'); R(19, 20, 2, 1, '#c07080'); R(21, 19, 1, 1, '#c07080'); } },
    front: ({ R }) => {
      R(13, 5, 14, 4, K); R(14, 6, 12, 3, '#1c1b22'); R(19, 6, 1, 3, '#3a3f5c'); // centre part
      // bangs swept to both sides, leaving a V of forehead in the middle and the eyes clear
      R(14, 9, 4, 1, '#1c1b22'); R(14, 10, 2, 1, '#1c1b22'); R(17, 9, 2, 0.5, '#1c1b22');
      R(21, 9, 2, 0.5, '#1c1b22'); R(22, 9, 4, 1, '#1c1b22'); R(24, 10, 2, 1, '#1c1b22');
      R(14, 11, 0.5, 8, '#1c1b22'); R(25.5, 11, 0.5, 8, '#1c1b22'); // thin strands framing the face
      R(12, 9, 2, 14, '#1c1b22'); R(26, 9, 2, 14, '#1c1b22'); R(15, 7, 3, 1, '#3a3f5c'); R(22, 7, 3, 1, '#3a3f5c');
      R(11, 4, 2, 1, '#1c1b22'); R(9, 5, 3, 1, '#1c1b22'); R(28, 5, 3, 1, '#1c1b22'); R(30, 6, 2, 1, '#1c1b22'); // stray strands
      // round glasses, half-cell thin rims
      for (const gx of [14.5, 21]) { R(gx + 1, 12.5, 2.5, 0.5, K); R(gx + 1, 17, 2.5, 0.5, K); R(gx + 0.5, 13, 0.5, 4, K); R(gx + 3.5, 13, 0.5, 4, K); R(gx + 1, 13, 0.5, 0.5, '#ffffff88'); }
      R(19, 14, 2, 0.5, K);
      // lantern earrings
      R(13, 19, 1, 1, '#d8a63a'); R(13, 20, 1, 2, '#e05a2b'); R(26, 19, 1, 1, '#d8a63a'); R(26, 20, 1, 2, '#e05a2b');
    },
  },
  // Hizkia (manager): neat dark-brown hair with a side part, calm straight brows over warm brown eyes,
  // white shirt under a navy vest with a little gold crown pin, a clipboard in hand, a checklist whiteboard behind him
  hizkia: {
    skin: '#f0d3bd', eye: '#7a4a2a', shirt: '#25335c', shirtHi: '#34467a',
    room: (F) => {
      F(2, 3, 10, 12, '#5e6478'); F(2.5, 3.5, 9, 11, '#ece8df'); // whiteboard
      for (const [y, done] of [[5, 1], [8, 1], [11, 0]]) { F(3.5, y, 1.5, 1.5, done ? '#3fa66b' : '#c9c2b4'); F(6, y + 0.5, 4.5, 0.5, '#6b7286'); }
      F(30, 3, 8, 11, '#2f3a5e'); F(30.5, 3.5, 3.25, 10, '#7fb0e0'); F(34.25, 3.5, 3.25, 10, '#7fb0e0'); F(31, 4, 1, 3, '#ffffff55'); // window
      F(29, 21, 11, 1, '#5a3e2b'); F(30, 17, 2, 4, '#b0413e'); F(32, 16, 1.5, 5, '#3d6fe0'); F(33.5, 18, 2, 3, '#d8a63a'); F(36, 17, 1.5, 4, '#3fa66b'); // shelf of books
    },
    clothes: ({ R }) => {
      R(16, 23, 3, 2, WH); R(21, 23, 3, 2, WH); R(19, 24, 2, 7, WH); // shirt collar and front
      R(17, 25, 2, 6, '#1a2444'); R(21, 25, 2, 6, '#1a2444'); // vest edges
      R(19.75, 27, 0.5, 0.5, '#c9c2b4'); R(19.75, 29, 0.5, 0.5, '#c9c2b4'); // buttons
      R(12, 26, 3, 1, '#d8a63a'); R(12, 25, 0.5, 1, '#d8a63a'); R(13.25, 25.25, 0.5, 0.75, '#d8a63a'); R(14.5, 25, 0.5, 1, '#d8a63a'); // crown pin
      R(26, 25, 5, 6, K); R(26.5, 25.5, 4, 5.5, '#b98b5a'); R(27, 26.5, 3, 4.5, WH); R(27.75, 25, 1.5, 1, '#9aa3b5'); // clipboard
      R(27.5, 27.5, 2, 0.4, '#6b7286'); R(27.5, 28.5, 2, 0.4, '#6b7286'); R(27.5, 29.5, 1.5, 0.4, '#3fa66b');
      R(25, 28, 1.5, 2, '#f0d3bd'); // thumb on the board
    },
    front: ({ R }) => {
      const H = '#2b1d16', HI = '#4a3226';
      R(13, 5, 14, 5, K); R(14, 6, 12, 4, H); R(19, 6.5, 5, 0.5, HI); R(17, 6, 0.5, 3, '#140d09'); // side part
      R(17.5, 9, 8.5, 1.5, H); R(14, 9, 3, 1, H); R(22, 10.5, 4, 0.5, H); // fringe swept to his left
      R(13, 9, 1, 6, H); R(26, 9, 1, 6, H); // short sideburns
      R(15, 12, 3, 0.5, H); R(22, 12, 3, 0.5, H); // calm straight brows
    },
  },
  // Salomo (riset): shoulder-length dark hair parted in the middle, a short beard, plum cardigan with a gold medallion,
  // a bookshelf and an open scroll behind him (the wise one who reads everything)
  salomo: {
    skin: '#e9c4a0', eye: '#3b2a1e', shirt: '#4b2f6b', shirtHi: '#64408c',
    room: (F, t) => {
      F(2, 3, 10, 20, '#3a2a20'); for (const y of [8, 13, 18]) F(2, y, 10, 0.5, '#5a3e2b'); // bookshelf
      [['#b0413e', '#3d6fe0', '#d8a63a', '#3fa66b'], ['#7a55b0', '#c9c2b4', '#b0413e'], ['#3fa66b', '#d8a63a', '#3d6fe0', '#c9c2b4']]
        .forEach((row, r) => row.forEach((c, i) => F(2.5 + i * 2.3, 4 + r * 5, 1.6, 4 - (i % 2) * 0.8, c)));
      F(29, 5, 9, 11, '#efe0bd'); F(28.5, 4.5, 10, 1, '#c9a76a'); F(28.5, 15.5, 10, 1, '#c9a76a'); // scroll
      for (let y = 7; y < 15; y += 1.5) F(30, y, 7 - (y % 3), 0.4, '#8a7350');
      F(36, 2, 1, 1, `rgba(255,224,138,${0.4 + 0.4 * Math.sin(t * 3)})`);
    },
    back: ({ R }) => { R(12, 7, 16, 16, K); R(13, 8, 14, 15, '#2a1a12'); },
    clothes: ({ R }) => {
      R(17, 23, 6, 3, '#efe6d6'); R(19, 25, 2, 6, '#efe6d6'); // shirt under the cardigan
      R(17.5, 24, 0.5, 3, '#d8a63a'); R(22, 24, 0.5, 3, '#d8a63a'); R(19, 27, 2, 2, '#d8a63a'); R(19.5, 27.5, 1, 1, '#f4d27a'); // medallion
    },
    front: ({ R }) => {
      const H = '#2a1a12';
      R(13, 5, 14, 5, K); R(14, 6, 12, 4, H); R(19.5, 6, 1, 2, '#170d08'); R(16, 6.5, 3, 0.5, '#4a3226'); // centre part
      R(14, 9, 4, 1.5, H); R(22, 9, 4, 1.5, H); // bangs swept aside
      R(12.5, 9, 1.5, 13, H); R(26, 9, 1.5, 13, H); // hair to the shoulders
      R(15, 12, 3, 0.5, H); R(22, 12, 3, 0.5, H);
      R(14, 18, 3, 4, H); R(23, 18, 3, 4, H); R(16, 21, 8, 1.5, H); R(17.5, 18, 5, 0.7, H); // beard and moustache
    },
  },
  // Daud (script): auburn curls, freckles, green eyes, a pen behind the ear, denim jacket over a white tee,
  // a lyre and floating notes behind him (the poet and musician)
  daud: {
    skin: '#f6d6be', eye: '#3f8a4f', shirt: '#3d6fa8', shirtHi: '#5a8cc4',
    room: (F, t) => {
      F(3, 6, 1, 12, '#c99a4a'); F(9, 6, 1, 12, '#c99a4a'); F(3, 6, 7, 1, '#c99a4a'); F(3, 17, 7, 1.5, '#a87a35'); // lyre
      for (const x of [5, 6.5, 8]) F(x, 7, 0.25, 10, '#f4e6c0');
      for (let i = 0; i < 3; i++) { const y = 22 - ((t * 2 + i * 5) % 16), x = 31 + i * 2.5; F(x, y, 1.2, 1, '#ffe08a'); F(x + 0.95, y - 2, 0.25, 2, '#ffe08a'); }
    },
    clothes: ({ R }) => {
      R(17, 23, 6, 3, WH); R(18, 25, 4, 6, WH); // white tee

// ---------- tiles ----------
const stage = document.getElementById('stage');
const tiles = new Map();
for (const a of TEAM) {
  const el = document.createElement('div');
  el.className = 'tile idle';
  el.innerHTML = `<canvas width="320" height="240"></canvas><div class="chip">standby</div>
    <div class="bubble" aria-live="polite"><span class="who">${a.name}</span><span class="say"></span><span class="caret"></span></div>
    <div class="name"><span class="dot"></span>${a.name} <span class="role">${a.role}</span></div><div class="hand">✋</div>`;
  stage.appendChild(el);
  const ctx = el.querySelector('canvas').getContext('2d');
  ctx.imageSmoothingEnabled = false;
  tiles.set(a.id, { el, a, ctx, chip: el.querySelector('.chip'), bubble: el.querySelector('.bubble'), say: el.querySelector('.say'), state: { talking: false, sleepy: false, needs: false }, since: Date.now(), text: '', shown: 0 });
}

// Fit every 4:3 tile into the stage: try each column count and keep the one that gives the biggest tiles
function fitStage() {
  const cs = getComputedStyle(stage);
  const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (w <= 0 || h <= 0) return;
  const n = TEAM.length, gap = w < 500 ? 8 : 14, border = 6;
  let best = { cols: 1, tw: 0 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const byW = (w - gap * (cols - 1)) / cols;
    const byH = ((h - gap * (rows - 1)) / rows - border) * 4 / 3 + border;
    const tw = Math.min(byW, byH);
    if (tw > best.tw) best = { cols, tw };
  }
  stage.style.setProperty('--cols', best.cols);
  stage.style.setProperty('--gap', gap + 'px');
  stage.style.setProperty('--tw', Math.max(90, Math.floor(best.tw)) + 'px');
}
new ResizeObserver(fitStage).observe(stage);
fitStage();

function setTile(id, { talking = false, needs = false, chip = 'standby', say = '', idleFor = 0 }) {
  const r = tiles.get(id);
  r.state = { talking, needs, sleepy: !talking && !needs && idleFor > 10 * 60_000 };
  r.el.classList.toggle('talking', talking);
  r.el.classList.toggle('needs', needs);
  r.el.classList.toggle('idle', !talking && !needs);
  r.chip.textContent = r.state.sleepy ? 'zzz…' : chip;
  if (say !== r.text) { r.text = say; r.shown = 0; } // a new line types itself out
  r.bubble.classList.toggle('on', !!say);
}

// ---------- the group chat (messages go through the office server; sena-bridge.mjs lets each teammate answer) ----------
const NAME_TO_ID = Object.fromEntries(TEAM.map((a) => [a.name.toLowerCase(), a.id]));
const logEl = document.getElementById('log');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hhmm = (ms) => new Date(ms).toTimeString().slice(0, 5);
function addLine(kind, who, text, at = Date.now()) {
  logEl.querySelector('.empty')?.remove();
  const near = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60;
  const li = document.createElement('li');
  li.className = kind;
  li.innerHTML = kind === 'sys' ? `${esc(who)} ${esc(text)} · ${hhmm(at)}` : `<span class="who">${esc(who)}<time>${hhmm(at)}</time></span>${esc(text)}`;
  logEl.appendChild(li);
  while (logEl.children.length > 120) logEl.firstChild.remove();
  if (near || kind === 'bos') logEl.scrollTop = logEl.scrollHeight;
}
const note = (who, text) => addLine('sys', who, text);

let chatSince = Date.now() - 6 * 3600_000, lastChatId = 0, bosSaid = { text: '', at: 0 }, mgrSaid = { text: '', at: 0 };
const said = {}; // what each teammate last said in the chat
async function pollChat() {
  try {
    const { messages = [] } = await (await fetch(`/chat?since=${chatSince}`)).json();
    for (const m of messages) {
      if (m.id <= lastChatId) continue;
      lastChatId = m.id; chatSince = Math.max(chatSince, m.timestamp - 1);
      if (m.sender === BOS) { addLine('bos', BOS, m.text, m.timestamp); bosSaid = { text: m.text, at: m.timestamp }; }
      else if (m.sender === MGR) { addLine('manager', MGR, m.text, m.timestamp); mgrSaid = { text: m.text, at: m.timestamp }; }
      else if (NAME_TO_ID[String(m.sender).toLowerCase()]) { // a teammate answering in the group chat
        addLine('agent', m.sender, m.text, m.timestamp); said[NAME_TO_ID[m.sender.toLowerCase()]] = { text: m.text, at: m.timestamp };
      }
    }
  } catch { /* the server is down: the header already says so */ }
}
pollChat();
setInterval(pollChat, 1500);

const box = document.getElementById('msg'), sendBtn = document.getElementById('send');
async function send() {
  const text = box.value.trim();
  if (!text) return;
  sendBtn.disabled = true;
  try {
    const r = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sender: BOS, text }) });
    if (!r.ok) throw new Error(r.status);
    box.value = '';
    pollChat();
  } catch { note('⚠', 'pesan gagal terkirim, server kantor nyala?'); }
  sendBtn.disabled = false;
  box.focus();
}
document.getElementById('compose').onsubmit = (e) => { e.preventDefault(); send(); };
box.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
const clip = (s, n = 110) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

// ---------- what an agent is doing, said the way a teammate would say it ----------
const base = (p) => String(p || '').trim().split(/[\\/]/).pop();
function say(status) {
  const s = String(status || '');
  let m;
  if ((m = /^googling '(.*)'/.exec(s))) return `Bentar, aku googling "${m[1]}"…`;
  if ((m = /^opening (.*)/.exec(s))) return `Lagi baca artikel di ${m[1]}…`;
  if ((m = /^reading (.*)/.exec(s))) return `Lagi baca ${base(m[1])}…`;
  if ((m = /^writing (.*)/.exec(s))) return `Aku tulis ke ${base(m[1])} ya…`;
  if ((m = /^editing (.*)/.exec(s))) return `Lagi revisi ${base(m[1])}…`;
  if ((m = /^searching for '(.*)'/.exec(s))) return `Nyari "${m[1]}" di catatan…`;
  if (/^finding files/.test(s)) return 'Nyari file yang pas…';
  if ((m = /^using \/(.*)/.exec(s))) return `Buka panduan ${m[1].split(':').pop()} dulu…`;
  if (/^running:|^using (PowerShell|Bash)/.test(s)) return 'Jalanin perintah sebentar…';
  if (/^using (Agent|Task)/.test(s)) return 'Oke, aku bagi tugas ke tim!';
  if (/^using mcp__ccd_turn|^using ToolSearch/.test(s)) return 'Beresin catatan dulu…';
  if (/^failed/.test(s)) return 'Eh, ada yang error. Aku coba lagi…';
  return null;
}
const THINK = ['Hmm… lagi mikir.', 'Bentar, brainstorming dulu…', 'Kayaknya aku punya ide…', 'Nyusun rencananya…'];

// ---------- live data from the office server ----------
let prev = {}, mgrIdleSince = Date.now(), bosSpokeAt = 0;
const promptSeen = {};

async function poll() {
  let agents, sessions, rapat;
  try {
    [agents, sessions, rapat] = await Promise.all([fetch('/agents').then((r) => r.json()), fetch('/sessions').then((r) => r.json()),
      fetch('/rapat-status.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : {})).catch(() => ({}))]);
    document.getElementById('offline').classList.remove('on');
  } catch {
    document.getElementById('offline').classList.add('on');
    return;
  }
  const now = Date.now(), cur = {};
  // the manager = the Claude session you talk to (the office's own chat bot is left out)
  // sessions the chat bridge runs for a teammate (or its router) are not the manager
  const owner = rapat.sessions || {}, router = new Set(rapat.router || []), busy = rapat.working || {};
  const own = {}; for (const s of sessions.sessions || []) if (owner[s.id] && owner[s.id] !== 'manager') own[owner[s.id]] = s;
  const main = (sessions.sessions || []).filter((s) => s.title !== 'agent-office-bot' && s.main && !router.has(s.id) && !(owner[s.id] && owner[s.id] !== 'manager'))
    .sort((a, b) => (b.lastActivityAt || 0) - (a.lastActivityAt || 0))[0];
  if (main) {
    const st = main.main.state, working = st === 'working' || st === 'compacting' || !!busy.manager, needs = st === 'needs-you';
    cur.manager = working ? 'kerja' : needs ? 'izin' : 'diam';
    if (working || needs) mgrIdleSince = now;
    const fresh = main.lastStatusAt && now - main.lastStatusAt < 6000;
    const replied = now - mgrSaid.at < 9000; // his last chat reply stays in the bubble for a moment
    const line = needs ? `${BOS}, aku butuh izin kamu di Claude ya 🙏` : working ? (fresh && say(main.lastStatus)) || THINK[Math.floor(now / 5000) % THINK.length] : replied ? clip(mgrSaid.text) : '';
    setTile('manager', { talking: working || replied, needs, chip: 'nunggu brief', say: line, idleFor: now - mgrIdleSince });
    // a brief typed in a Claude window (not this chat) gets a line; each session is tracked on its own
    const lp = main.main.lastPromptAt, seenLp = promptSeen[main.id];
    if (lp && lp !== seenLp) { if (seenLp && now - bosSaid.at > 8000) note(BOS, `kasih brief ke ${MGR} lewat Claude`); promptSeen[main.id] = lp; bosSpokeAt = Math.max(bosSpokeAt, lp); }
  } else setTile('manager', { chip: 'belum join' });
  const bosTalk = now - bosSaid.at < 6000;
  setTile('bos', { talking: bosTalk || now - bosSpokeAt < 2500, chip: '', say: bosTalk ? clip(bosSaid.text) : '' });
  const typing = Object.keys(busy).map((id) => tiles.get(id)?.a.name).filter(Boolean);
  if (cur.manager === 'kerja' && !typing.includes(MGR)) typing.unshift(MGR);
  document.getElementById('typing').textContent = typing.length ? `${typing.join(', ')} lagi ngetik…` : '';

  const byId = {};
  for (const ag of agents.agents || []) { const id = NAME_TO_ID[(ag.name || '').toLowerCase()]; if (id) byId[id] = ag; }
  for (const a of TEAM.slice(2)) {
    const ag = byId[a.id], r = tiles.get(a.id), mine = own[a.id];
    const chatting = !!busy[a.id] || (mine && ['working', 'compacting'].includes(mine.main?.state));
    const spoke = said[a.id] && now - said[a.id].at < 9000;
    const task = ag ? String(ag.task || '').replace(new RegExp('^' + a.name + ':\\s*', 'i'), '') : '';
    cur[a.id] = ag ? 'kerja' : 'diam';
    if (ag && prev[a.id] !== 'kerja') { r.since = now; r.startedAt = now; note(a.name, 'mulai: ' + task); }
    if (!ag && prev[a.id] === 'kerja') { r.since = now; note(a.name, 'selesai ✓'); }
    if (chatting && !ag) cur[a.id] = 'chat';
    let line = '';
    if (ag) line = now - r.startedAt < 3500 ? `Siap! Aku kerjain: ${task}` : say(ag.status) || THINK[Math.floor(now / 5000 + a.name.length) % THINK.length];
    else if (spoke) line = clip(said[a.id].text);
    else if (chatting) line = (mine?.lastStatusAt && now - mine.lastStatusAt < 6000 && say(mine.lastStatus)) || THINK[Math.floor(now / 5000 + a.name.length) % THINK.length];
    if (ag || chatting || spoke) r.since = now;
    setTile(a.id, { talking: !!ag || chatting || spoke, chip: 'standby', say: line, idleFor: now - r.since });
  }
  if (prev.manager && prev.manager !== cur.manager && cur.manager === 'izin') note(MGR, 'butuh izin kamu');
  prev = cur;
  const live = Object.values(cur).filter((v) => v === 'kerja' || v === 'chat').length;
  document.getElementById('count').textContent = `${TEAM.length} peserta · ${live} lagi kerja`;
}
poll();
setInterval(poll, 1000);

// ---------- draw loop: avatars, typing bubbles, call timer ----------
const t0 = performance.now();
function frame(ms) {
  const t = (ms - t0) / 1000;
  for (const r of tiles.values()) {
    drawAvatar(r.ctx, r.a, t, r.state);
    if (r.shown < r.text.length) { r.shown = Math.min(r.text.length, r.shown + 1.2); r.say.textContent = r.text.slice(0, Math.floor(r.shown)); }
  }
  const s = Math.floor(t), mm = String(Math.floor(s / 60) % 60).padStart(2, '0'), ss = String(s % 60).padStart(2, '0');
  document.getElementById('timer').textContent = s >= 3600 ? `${Math.floor(s / 3600)}:${mm}:${ss}` : `${mm}:${ss}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const side = document.getElementById('side'), chatBtn = document.getElementById('chatBtn');
const showNotes = (on) => { side.classList.toggle('hidden', !on); chatBtn.classList.toggle('on', on); chatBtn.setAttribute('aria-pressed', String(on)); fitStage(); };
if (innerWidth < 760) showNotes(false); // phones: the faces first
chatBtn.onclick = () => showNotes(side.classList.contains('hidden'));
</script>
